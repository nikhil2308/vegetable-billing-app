<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#198754"
    >

    <title>Mahesh Fruits and Vegetables</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

</head>


<body>

    <div class="app">

        <!-- =========================
             SHOP HEADER
        ========================== -->

        <div class="shop-header">

            <h1>
                Mahesh Fruits and Vegetables
            </h1>

            <p>
                Vegetable Bill
            </p>

        </div>


        <!-- =========================
             ADD ITEM FORM
        ========================== -->

        <div class="form-section">

            <label>
                Vegetable / Item Name
            </label>

            <input
                type="text"
                id="vegetableName"
                placeholder="e.g. Tomato"
                autocomplete="off"
            >


            <label>
                Quantity
            </label>

            <div class="quantity-row">

                <input
                    type="number"
                    id="quantity"
                    placeholder="e.g. 500"
                    min="0"
                    step="0.01"
                >

                <select id="unit">

                    <option value="kg">
                        KG
                    </option>

                    <option value="gram">
                        Grams
                    </option>

                    <option value="bunch">
                        Bunch
                    </option>

                    <option value="piece">
                        Piece
                    </option>

                    <option value="bottle">
                        Bottle
                    </option>

                    <option value="packet">
                        Packet
                    </option>

                    <option value="box">
                        Box
                    </option>

                </select>

            </div>


            <!-- PRICE -->

            <label id="priceLabel">
                Price per KG
            </label>

            <input
                type="number"
                id="price"
                placeholder="e.g. 60"
                min="0"
                step="0.01"
            >


            <button
                id="addItemBtn"
                class="add-btn"
                type="button"
            >
                + Add Item
            </button>

        </div>


        <!-- =========================
             CURRENT BILL
        ========================== -->

        <div class="bill-section">

            <div class="bill-title">

                <h2>
                    Current Bill
                </h2>

                <span id="itemCount">
                    0 items
                </span>

            </div>


            <!-- BILL ITEMS -->

            <div id="billItems">

                <div class="empty-bill">
                    No items added yet
                </div>

            </div>


            <!-- SUBTOTAL -->

            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <strong>
                    ₹<span id="subtotalAmount">0.00</span>
                </strong>

            </div>


            <!-- =========================
                 DELIVERY CHARGE
            ========================== -->

            <div class="delivery-section">

                <label for="deliveryCharge">
                    Delivery Charge
                    <span class="optional">
                        (Optional)
                    </span>
                </label>

                <div class="delivery-input">

                    <span>
                        ₹
                    </span>

                    <input
                        type="number"
                        id="deliveryCharge"
                        placeholder="0"
                        min="0"
                        step="0.01"
                    >

                </div>

            </div>


            <!-- =========================
                 TOTAL
            ========================== -->

            <div class="total-section">

                <span>
                    TOTAL
                </span>

                <strong>
                    ₹<span id="totalAmount">0.00</span>
                </strong>

            </div>

        </div>


        <!-- =========================
             ACTION BUTTONS
        ========================== -->

        <div class="action-buttons">

            <button
                id="clearBtn"
                class="clear-btn"
                type="button"
            >
                Clear Bill
            </button>


            <button
                id="whatsappBtn"
                class="whatsapp-btn"
                type="button"
            >
                📷 Share Bill Image
            </button>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="app.js"></script>


    <!-- =========================
         SERVICE WORKER
    ========================== -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker
                        .register(
                            "service-worker.js"
                        )

                        .then(
                            registration => {

                                console.log(
                                    "Service Worker registered:",
                                    registration.scope
                                );

                            }
                        )

                        .catch(
                            error => {

                                console.error(
                                    "Service Worker registration failed:",
                                    error
                                );

                            }
                        );

                }
            );

        }

    </script>

</body>

</html>
